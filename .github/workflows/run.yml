name: Magic Ball AI Daily Automation

on:
  schedule:
    - cron: '0 4 * * *' # প্রতিদিন বাংলাদেশ সময় সকাল ১০টায় রান করবে
  workflow_dispatch: # হাত দিয়ে ম্যানুয়ালি রান করার জন্য

jobs:
  run-ai-factory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-generativeai requests

      - name: Run Magic Ball Engine
        run: |
          python main.py
