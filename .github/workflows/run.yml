name: Magic Ball AI 5-Times Daily Automation

on:
  schedule:
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch:

jobs:
  run-ai-factory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install google-generativeai requests

      - name: Run Magic Ball Engine
        run: |
          python main.py

      - name: Commit and Push Lightweight Storage JSON
        run: |
          git config --global user.name "AI Automation Bot"
          git config --global user.email "bot@ai.local"
          git add lightweight_storage.json
          git commit -m "Auto-update lightweight_storage.json for 4 channels [skip ci]" || echo "No changes to commit"
          git push
